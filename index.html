<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B365D">
<meta name="description" content="工程材料及热处理C · 高效记忆宝典：考点挖空背诵、20个牌号翻转卡、48道真题自测与自动错题本。">
<title>工程材料及热处理C · 高效记忆刷题台</title>
<style>
:root{
  --ink:#1B365D; --ink-2:#24476F; --accent:#2B6CB0; --accent-l:#3E8ED0;
  --amber:#FFFBEB; --amber-b:#F0DBA0; --amber-t:#8A5A00;
  --bg:#F4F7FB; --card:#FFFFFF; --line:#E2E8F0; --line-2:#EDF1F6;
  --text:#22303F; --text-2:#43566B; --muted:#6B7C93;
  --green:#2F855A; --green-bg:#EAF7EF; --red:#C53030; --red-bg:#FDECEC;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.72;
  overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
b,strong{font-weight:800}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ============ HEADER ============ */
.hd{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#16294A 0%,#1B365D 42%,#2B6CB0 100%);
  padding:calc(16px + env(safe-area-inset-top)) 16px 18px;
}
.hd::before{
  content:"";position:absolute;inset:0;opacity:.10;
  background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px);
  background-size:26px 26px;
}
.hd::after{
  content:"";position:absolute;right:-56px;top:-70px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,180,255,.42),transparent 68%);
}
.hd-in{position:relative;z-index:1;max-width:880px;margin:0 auto}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hd-kicker{font-size:11px;font-weight:700;letter-spacing:1.2px;opacity:.78}
.hd h1{margin:3px 0 0;font-size:20px;line-height:1.35;letter-spacing:.4px;font-weight:800}
.hd h1 span{font-weight:500;opacity:.8;font-size:13px;display:block;letter-spacing:.3px;margin-top:2px}
.share-btn{
  flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:13px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
  color:#fff;font-size:13px;font-weight:800;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:transform .15s,background .15s;
}
.share-btn:active{transform:scale(.96);background:rgba(255,255,255,.3)}
.hd-stats{display:flex;gap:8px;margin-top:14px}
.stat{
  flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  border-radius:11px;padding:6px 8px;text-align:center;line-height:1.25;
}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:.5px}
.stat span{font-size:10.5px;opacity:.8;font-weight:600}

/* ============ TABS ============ */
.tabs{
  position:sticky;top:0;z-index:40;display:block;padding:6px;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(27,54,93,.05);
}
.tabs-in{display:flex;gap:5px;width:100%;max-width:880px;margin:0 auto}
.tab{
  flex:1;min-height:46px;border-radius:11px;font-size:14px;font-weight:800;color:#5A6B7F;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background .18s,color .18s,box-shadow .18s;
}
.tab i{font-style:normal;font-size:15px}
.tab.active{background:var(--ink);color:#fff;box-shadow:0 5px 14px rgba(27,54,93,.24)}
.tab:active{transform:scale(.985)}

/* ============ LAYOUT ============ */
main{padding:14px 12px 40px;max-width:880px;margin:0 auto}
.panel{display:none}
.panel.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* ============ READ BAR ============ */
.read-bar{margin-bottom:12px}
.chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:800;
  background:#fff;border:1px solid var(--line);color:#5A6B7F;white-space:nowrap;
  display:inline-flex;align-items:center;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(43,108,176,.26)}
.cloze-row{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:8px 12px;min-height:56px;
}
.switch{position:relative;flex:0 0 50px;height:30px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:2}
.sl{position:absolute;inset:0;border-radius:999px;background:#CBD5E1;transition:.22s}
.sl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl::after{transform:translateX(20px)}
.cloze-txt{flex:1;line-height:1.3}
.cloze-txt b{display:block;font-size:12.5px;color:var(--ink);font-weight:800}
.cloze-txt span{font-size:10.5px;color:var(--muted)}
.cloze-cnt{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--accent);background:#EAF2FB;border-radius:999px;padding:3px 9px}

/* ============ CHAPTER CARD ============ */
.chapter{background:var(--card);border:1px solid #E4EAF2;border-radius:var(--r);overflow:hidden;margin-bottom:15px;box-shadow:0 2px 10px rgba(27,54,93,.05)}
.ch-head{padding:13px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#FAFCFF,#fff)}
.ch-no{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--accent);opacity:.85}
.ch-title{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.35;margin-top:1px}
.ch-cnt{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--accent);background:#EAF2FB;padding:4px 8px;border-radius:999px;white-space:nowrap;margin-top:2px}
.ch-focus{margin:11px 13px 0;padding:8px 11px;font-size:13.5px;line-height:1.6;color:var(--text-2);background:#F5F8FC;border-radius:10px;border-left:3px solid #CFE0F2}
.tips{margin:11px 13px 2px;padding:11px 13px;background:var(--amber);border:1px solid var(--amber-b);border-left:4px solid #D99E00;border-radius:12px}
.tips-h{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--amber-t);margin-bottom:5px;letter-spacing:.3px}
.tip{margin:6px 0;font-size:14.5px;line-height:1.75;color:#5C4310}
.tip b{color:var(--amber-t)}
.tip .blank{background:#F6E7B4}

/* ============ BLOCK ============ */
.blk{padding:0 13px 4px}
.blk:last-child{padding-bottom:14px}
.h-blk{padding-bottom:0}
.blk-h{position:relative;font-size:15px;font-weight:800;color:var(--ink);margin:16px 0 8px;padding-left:10px;line-height:1.4}
.blk-h::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--accent-l),var(--ink))}
.li{position:relative;margin:7px 0;padding-left:13px;font-size:15px;line-height:1.78;color:#2C3A4B}
.li::before{content:"";position:absolute;left:1px;top:10px;width:5px;height:5px;border-radius:50%;background:#9BB4D0}
.li b{color:var(--ink)}

/* ============ TABLE ============ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #E4EAF2;border-radius:11px;margin:6px 0 2px;background:#fff}
.tw table{border-collapse:collapse;width:100%;font-size:14px}
.tw th{background:#EAF2FB;color:var(--ink);font-weight:800;text-align:left;padding:8px 9px;border-bottom:1px solid #D6E2F0;font-size:13.5px;line-height:1.45}
.tw td{padding:8px 9px;border-bottom:1px solid #F1F5F9;vertical-align:top;line-height:1.62;font-size:14px;color:#2C3A4B}
.tw tr:last-child td{border-bottom:0}
.tw tbody tr:nth-child(even){background:#FAFCFF}
.tw td:first-child{font-weight:800;color:var(--ink);min-width:78px}
.tw th:first-child{min-width:78px}
.tw b{color:var(--ink)}
.tbl-note{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 2px 0;padding-left:8px;border-left:2px solid #DCE6F2}

/* ============ NOTE ============ */
.note{margin:10px 0 4px;padding:9px 12px;border-radius:11px;border:1px solid;font-size:14px;line-height:1.7}
.note>b{display:block;font-size:12px;margin-bottom:2px;letter-spacing:.3px}
.note.key{background:#EEF6FE;border-color:#BFD8F0;color:#1B365D}
.note.key>b{color:var(--accent)}
.note.warn{background:#FFF4F4;border-color:#F3C1C1;color:#8A2B2B}
.note.warn>b{color:#B02A2A}
.note.pin{background:var(--amber);border-color:var(--amber-b);color:#6B4E10}
.note.pin>b{color:var(--amber-t)}

/* ============ QA ============ */
.qa{border:1px solid #E4EAF2;border-radius:11px;overflow:hidden;margin:8px 0}
.qa-q{background:#F3F7FC;padding:9px 12px;font-size:15px;font-weight:800;color:var(--ink);line-height:1.78;border-bottom:1px solid #E4EAF2}
.qa-a{padding:10px 12px;font-size:15px;line-height:1.78;color:#2C3A4B}
.qa-a::before{content:"解";display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:5px;background:#2F855A;color:#fff;font-size:10px;font-weight:800;margin-right:6px;vertical-align:1px}

/* ============ CHAIN ============ */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:8px 0 4px}
.chain .step{background:#EAF2FB;border:1px solid #CFE0F2;color:var(--ink);font-weight:800;font-size:11.5px;padding:4px 8px;border-radius:7px;white-space:nowrap}
.chain .arw{color:#A9C0D8;font-weight:800;font-size:11px}

/* ============ BARS ============ */
.bars{display:grid;gap:7px;margin:9px 0 4px}
.bar-row{display:grid;grid-template-columns:78px 1fr 82px;gap:8px;align-items:center;font-size:11px}
.bar-lb{font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:9px;background:#EDF2F8;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#8CBBE4,#2B6CB0)}
.bar-v{color:var(--muted);font-size:10.5px;text-align:right;white-space:nowrap}

/* ============ 课件原图 ============ */
.fig{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 0}
.fig.two{grid-template-columns:1fr 1fr}
.shot{margin:0;padding:6px;background:#fff;border:1px solid #E4EAF2;border-radius:11px;box-shadow:0 1px 5px rgba(27,54,93,.05);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shot img{display:block;width:100%;height:auto;border-radius:7px;cursor:zoom-in}
.fig-cap{margin:8px 2px 0;text-align:center;font-size:13px;line-height:1.6;color:var(--accent);font-weight:600}
@media (max-width:640px){.fig.two{grid-template-columns:1fr}}

/* 图片灯箱 */
.lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(10,20,34,.95);cursor:zoom-out}
.lightbox.show{display:flex;animation:fade .16s ease}
.lightbox img{max-width:100%;max-height:90vh;width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.lb-tip{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:.5px}

/* ============ CLOZE ============ */
.blank{padding:0 2px;border-radius:4px;transition:background .16s,color .16s}
body.cloze .blank{
  background:#1B365D;color:transparent;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.14);
  border-radius:4px;
}
body.cloze .blank:active{background:#3E8ED0}
body.cloze .blank.revealed{background:#FFF3C4;color:#7A4E00;font-weight:800;box-shadow:none;-webkit-user-select:text;user-select:text}
body.cloze .tips .blank{background:#E8C97A}
body.cloze .tips .blank.revealed{background:#FFF3C4}

/* ============ GUIDE ============ */
.guide{background:linear-gradient(150deg,#1B365D,#2B6CB0);color:#fff;border-radius:var(--r);padding:15px;margin-bottom:15px;box-shadow:0 8px 22px rgba(27,54,93,.2)}
.guide h3{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:.4px}
.guide p.sub{margin:0 0 11px;font-size:11.5px;opacity:.82;line-height:1.6}
.g-step{display:flex;gap:9px;margin:8px 0;font-size:12.5px;line-height:1.65}
.g-num{flex:0 0 21px;height:21px;border-radius:7px;background:rgba(255,255,255,.2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.g-step b{color:#FFE9A8}

/* ============ FLASHCARD ============ */
.fc-wrap{max-width:540px;margin:0 auto}
.fc-meta{display:flex;justify-content:space-between;align-items:center;padding:0 3px 8px;font-size:12px;color:var(--muted);font-weight:700}
.fc-state{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#EDF2F8;color:#5A6B7F}
.fc-state.known{background:var(--green-bg);color:var(--green)}
.fc-state.weak{background:#FFF1F1;color:#B02A2A}
.fc{perspective:1400px;height:420px;margin:0 0 12px}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.15,.2,1);cursor:pointer}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;border-radius:20px;padding:20px;overflow-y:auto;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  -webkit-overflow-scrolling:touch;
}
.fc-front{
  background:linear-gradient(155deg,#16294A,#1B365D 40%,#2B6CB0);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 16px 34px rgba(27,54,93,.28);text-align:center;
}
.fc-front::before{
  content:"";position:absolute;inset:0;border-radius:20px;opacity:.13;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:30px 30px;
}
.fc-chip{position:relative;z-index:1;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26)}
.fc-code{position:relative;z-index:1;font-size:40px;font-weight:800;letter-spacing:1.5px;margin:16px 0 6px;line-height:1.15;word-break:break-all}
.fc-code.sm{font-size:30px}
.fc-hint{position:relative;z-index:1;font-size:11px;opacity:.7;margin-top:14px;letter-spacing:.5px}
.fc-back{background:#fff;border:1px solid #DCE6F2;transform:rotateY(180deg);box-shadow:0 12px 28px rgba(27,54,93,.12)}
.fc-bh{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--accent);margin-bottom:8px}
.fc-code-b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.6px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px dashed #DCE6F2;word-break:break-all}
.fc-row{display:flex;gap:8px;margin:7px 0;font-size:14px;line-height:1.62}
.fc-k{flex:0 0 64px;font-weight:800;color:var(--muted);font-size:13px;padding-top:1px}
.fc-v{flex:1;color:#2C3A4B}
.fc-v b{color:var(--ink)}
.fc-point{margin-top:10px;padding:8px 10px;background:var(--amber);border-radius:9px;border-left:3px solid #D99E00;font-size:13.5px;line-height:1.62;color:#6B4E10}
.fc-point b{color:var(--amber-t)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.fc-actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fc-actions2.one{grid-template-columns:1fr}
.btn{
  min-height:46px;border-radius:12px;font-size:14px;font-weight:800;
  background:#fff;border:1px solid var(--line);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:transform .12s,background .15s,box-shadow .15s;
}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 5px 14px rgba(27,54,93,.22)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(43,108,176,.22)}
.btn.ok{background:var(--green-bg);border-color:#B7E4C7;color:#276749}
.btn.no{background:#FFF1F1;border-color:#F5C2C2;color:#9B2C2C}
.btn.ghost{background:#F5F8FC;color:#43566B}
.btn:disabled{opacity:.42;box-shadow:none}
.fc-dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:4px}
.dot{width:34px;height:34px;border-radius:8px;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);color:#7C8CA0;display:flex;align-items:center;justify-content:center;padding:0}
.dot.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.dot.known{background:#D7F0E1;border-color:#A9DCBF;color:#276749}
.dot.weak{background:#FDE0E0;border-color:#F3BDBD;color:#9B2C2C}

/* ============ QUIZ ============ */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.mode{
  min-height:44px;border-radius:11px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;font-weight:800;color:#5A6B7F;display:flex;align-items:center;justify-content:center;
}
.mode.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 11px rgba(43,108,176,.24)}
.pg-txt{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);font-weight:700;padding:0 2px 5px}
.pg-txt b{color:var(--ink)}
.pg-rate{color:var(--green)}
.pg-track{height:5px;background:#E4EBF3;border-radius:4px;overflow:hidden;margin-bottom:12px}
.pg-fill{height:100%;background:linear-gradient(90deg,#3E8ED0,#1B365D);border-radius:4px;transition:width .3s}
.qcard{background:#fff;border:1px solid #E4EAF2;border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(27,54,93,.05);animation:pop .22s ease}
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.q-tag{font-size:10px;font-weight:800;letter-spacing:.8px;padding:3px 8px;border-radius:6px;background:#EAF2FB;color:var(--accent)}
.q-tag.dual{background:#FFF3D6;color:#8A5A00}
.q-no{font-size:10.5px;font-weight:800;color:#A9B8C8;letter-spacing:.6px}
.q-stem{font-size:16px;font-weight:700;line-height:1.7;color:#1F2D3D;margin-bottom:11px}
.q-stem .u{color:var(--accent);font-weight:800;padding:0 1px}
.dual-hint{font-size:11px;color:#8A5A00;background:#FFF8E8;border:1px dashed #EBD39A;border-radius:8px;padding:5px 9px;margin-bottom:10px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:9px;width:100%;min-height:52px;text-align:left;
  padding:11px 12px;border-radius:11px;border:1.5px solid #DCE6F2;background:#fff;
  font-size:15px;line-height:1.55;color:#243447;position:relative;
  transition:border-color .15s,background .15s,transform .12s;
}
.opt:active{transform:scale(.99)}
.opt .key{
  flex:0 0 24px;height:24px;border-radius:7px;background:#EDF3FA;color:var(--accent);
  font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .ot{flex:1}

function loadJSON(key, def) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return def;
    const v = JSON.parse(raw);
    return (v && typeof v === 'object') ? v : def;
  } catch (e) { return def; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

/* =========================================================
   3. 工具函数
   ========================================================= */
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/* 支持 **加粗** 与 [[挖空]] 两种标记 */
function fmt(s) {
  let t = esc(s);
  /* 允许数据中使用 <b></b> 做强调（仅此一种标签） */
  t = t.replace(/&lt;(\/?b)&gt;/g, '<$1>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/\[\[(.+?)\]\]/g, '<span class="blank">$1</span>');
  t = t.replace(/\n/g, '<br>');
  return t;
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
}

}

function blockHTML(b) {
  if (b.t === 'h') {
    return '<div class="blk h-blk"><div class="blk-h">' + fmt(b.h) + '</div></div>';
  }
  if (b.t === 'p') {
    return '<div class="blk">' + (b.h ? '<div class="blk-h">' + esc(b.h) + '</div>' : '') +
      b.items.map(x => '<p class="li">' + fmt(x) + '</p>').join('') + '</div>';
  }
  if (b.t === 'table') {
    const n = b.head.length;
    let chars = 0, cnt = 0;
    b.head.forEach(h => { chars += String(h).length; cnt++; });
    b.rows.forEach(r => r.forEach(c => { chars += String(c).length; cnt++; }));
    const avg = chars / Math.max(1, cnt);
    /* 列多或单格文字长 → 小屏折叠为卡片式，避免挤成豆腐块 */
    const stack = (n >= 5 || avg > 26) ? ' stack' : '';
    const w = n >= 5 ? n * 100 : (n === 4 ? 420 : 310);
    return '<div class="blk">' + (b.h ? '<div class="blk-h">' + esc(b.h) + '</div>' : '') +
      '<div class="tw' + stack + '"><table style="min-width:' + w + 'px"><thead><tr>' +
      b.head.map(h => '<th>' + fmt(h) + '</th>').join('') +
      '</tr></thead><tbody>' +
      b.rows.map(r => '<tr>' + r.map((c, i) => '<td data-label="' + esc((b.head[i] || '').split('（')[0]) + '">' + fmt(c) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>' +
      (b.note ? '<div class="tbl-note">' + fmt(b.note) + '</div>' : '') + '</div>';
  }
  if (b.t === 'qa') {
    return '<div class="blk"><div class="qa"><div class="qa-q">' + fmt(b.q) + '</div>' +
      '<div class="qa-a">' + fmt(b.a) + '</div></div></div>';
  }
  if (b.t === 'note') {
    return '<div class="blk"><div class="note ' + b.kind + '"><b>' + esc(b.h) + '</b><div>' + fmt(b.text) + '</div></div></div>';
  }
  if (b.t === 'chain') {
    return '<div class="blk"><div class="blk-h">' + esc(b.h) + '</div><div class="chain">' +
      b.steps.map((s, i) => (i ? '<span class="arw">→</span>' : '') + '<span class="step">' + fmt(s) + '</span>').join('') +
      '</div>' + (b.note ? '<div class="tbl-note">' + fmt(b.note) + '</div>' : '') + '</div>';
  }
  if (b.t === 'bars') {
    return '<div class="blk"><div class="blk-h">' + esc(b.h) + '</div><div class="bars">' +
      b.rows.map(r => '<div class="bar-row"><span class="bar-lb">' + fmt(r.k) + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + r.w + '%"></div></div>' +
        '<span class="bar-v">' + fmt(r.v) + '</span></div>').join('') +
      '</div>' + (b.note ? '<div class="tbl-note">' + fmt(b.note) + '</div>' : '') + '</div>';
  }
  if (b.t === 'img') {
    const imgs = b.imgs || [];
    return '<div class="blk"><div class="fig' + (imgs.length > 1 ? ' two' : '') + '">' +
      imgs.map(im => '<figure class="shot"><img src="' + esc(im.src) + '" alt="' + esc(im.alt) +
        '" loading="lazy" decoding="async"></figure>').join('') +
      '</div>' + (b.cap ? '<div class="fig-cap">' + fmt(b.cap) + '</div>' : '') + '</div>';
  }
  return '';
}

function chapterHTML(ch) {
  const tips = ch.tips.map(t =>
    '<div class="tip"><b>' + esc(t.h) + '：</b>' + fmt(t.t) + '</div>'
  ).join('');
  return '<article class="chapter" data-ch="' + ch.id + '">' +
    '<div class="ch-head"><div><div class="ch-no">CHAPTER ' + esc(ch.no) + '</div>' +
    '<div class="ch-title">' + esc(ch.name) + '　' + esc(ch.title) + '</div></div>' +
    '<span class="ch-cnt">遮罩 0/0</span></div>' +
    '<div class="ch-focus">🎯 核心聚焦：' + esc(ch.focus) + '</div>' +
    '<div class="tips"><div class="tips-h">🧠 记忆口诀与避坑指南</div>' + tips + '</div>' +
    ch.blocks.map(blockHTML).join('') +

}

function renderChapters() {
  const list = STUDY_DATA.chapters.filter(c => state.ch === 'all' || c.id === state.ch);
  $('chapterList').innerHTML = (state.ch === 'all' ? guideHTML() : '') + list.map(chapterHTML).join('');
  bindBlanks();
}

function bindBlanks() {
  document.querySelectorAll('#chapterList .chapter').forEach(card => {
    const arr = progress.revealed[card.dataset.ch] || [];
    card.querySelectorAll('.blank').forEach((el, i) => {
      el.dataset.i = i;
      if (arr.indexOf(i) >= 0) el.classList.add('revealed');
    });
  });
  /* 仍会横向溢出的表格，补一条滑动提示 */
  document.querySelectorAll('#chapterList .tw').forEach(tw => {
    if (tw.scrollWidth > tw.clientWidth + 4) {
      const nx = tw.nextElementSibling;
      if (!nx || !nx.classList.contains('swipe-tip')) {
        tw.insertAdjacentHTML('afterend', '<div class="swipe-tip">← 左右滑动查看完整表格 →</div>');
      }
    }
  });
  updateClozeMeta();
}

function updateClozeMeta() {
  let total = 0, done = 0;
  document.querySelectorAll('#chapterList .chapter').forEach(card => {
    const blanks = card.querySelectorAll('.blank');
    const rev = card.querySelectorAll('.blank.revealed');
    total += blanks.length; done += rev.length;
    const cnt = card.querySelector('.ch-cnt');
    if (cnt) cnt.textContent = state.cloze ? ('遮罩 ' + rev.length + '/' + blanks.length) : (blanks.length + ' 个可遮挡考点');
  });
  $('clozeCnt').textContent = done + ' / ' + total;
  $('clozeLabel').textContent = state.cloze ? '背诵遮挡已开启' : '已显示全部答案';
  $('clozeHint').textContent = state.cloze ? '点击深色遮罩可单块翻开自测' : '打开开关进入挖空自测模式';
}

function renderFilter() {

function renderCard() {

  if (state.cardIdx >= list.length) state.cardIdx = 0;

function renderDots() {
  const list = STUDY_DATA.flashcards;
  $('fcDots').innerHTML = list.map((c, i) => {
    const st = cardState[c.code];
    let cls = 'dot';
    if (i === state.cardIdx) cls += ' cur';
    else if (st === 'known') cls += ' known';
    else if (st === 'weak') cls += ' weak';
    return '<button class="' + cls + '" data-card="' + i + '" aria-label="' + esc(c.code) + '">' + (i + 1) + '</button>';
  }).join('');

let cardTimer = null;
function markCard(v) {
  const c = STUDY_DATA.flashcards[state.cardIdx];
  const unmark = cardState[c.code] === v;
  if (unmark) delete cardState[c.code];
  else cardState[c.code] = v;
  saveJSON(KEY.cards, cardState);
  renderStats();

  /* 取消标记：提示改为「已取消标记」，停留在当前卡片，不自动跳下一张 */
  if (unmark) {
    clearTimeout(cardTimer);
    toast('已取消标记');
    const stEl = $('fcState');
    stEl.textContent = '未标记';
    stEl.className = 'fc-state';
    renderDots();
    return;
  }

  toast(v === 'known' ? '✅ 已标记为牢记' : '🔁 已加入重点强化');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => {
    state.cardIdx = (state.cardIdx + 1) % STUDY_DATA.flashcards.length;
    renderCard();
  }, 240);
}

/* =========================================================
   7. Tab 3 —— 真题刷题
   ========================================================= */
const ALLQ = STUDY_DATA.tfQuestions.map(q => ({
  id: 'tf-' + q.n, kind: 'tf', n: q.n, q: q.q, a: q.a, exp: q.exp, dual: false
})).concat(STUDY_DATA.mcQuestions.map(q => ({
  id: 'mc-' + q.n, kind: 'mc', n: q.n, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp, dual: q.ans.length > 1
})));
const QMAP = {};
ALLQ.forEach(q => { QMAP[q.id] = q; });

function buildOrder(mode) {
  if (mode === 'seq') return ALLQ.map(q => q.id);
  if (mode === 'rand') return shuffle(ALLQ.map(q => q.id));
  if (mode === 'wrong') return ALLQ.filter(q => wrongBook[q.id]).map(q => q.id);
  return [];
}

function setMode(mode) {
  quiz.mode = mode;
  document.querySelectorAll('#modeBar .mode').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'overview') { quiz.finished = false; renderQuiz(); return; }
  quiz.order = buildOrder(mode);
  quiz.i = 0; quiz.sel = []; quiz.judged = false; quiz.ok = false; quiz.finished = false;
  quiz.sTotal = 0; quiz.sRight = 0; quiz.marks = {};
  renderQuiz();
}

function ansText(q) {
  if (q.kind === 'tf') return q.a ? '√ 正确' : '× 错误';
  if (q.dual) return q.ans.map((L, i) => '第' + (i + 1) + '空 ' + L).join(' ｜ ');
  return q.ans[0];
}

function optsHTML(q) {
  if (q.kind === 'tf') {
    const arr = [{ k: '1', v: 'T', t: '正确 √' }, { k: '2', v: 'F', t: '错误 ×' }];
    return arr.map(o => {
      let cls = 'opt';
      if (quiz.judged) {
        const isAns = (o.v === 'T') === q.a;
        if (isAns) cls += ' correct';
        else if (quiz.sel[0] === o.v) cls += ' wrong';
        else cls += ' dim';
      } else if (quiz.sel[0] === o.v) cls += ' sel';
      return '<button class="' + cls + '" data-pick="' + o.v + '">' +
        '<span class="key">' + o.k + '</span><span class="ot">' + o.t + '</span></button>';
    }).join('');
  }
  return q.opts.map((t, i) => {
    const L = 'ABCD'[i];
    let cls = 'opt';
    if (quiz.judged) {
      if (q.ans.indexOf(L) >= 0) cls += ' correct';
      else if (quiz.sel.indexOf(L) >= 0) cls += ' wrong';
      else cls += ' dim';
    } else if (quiz.sel.indexOf(L) >= 0) cls += ' sel';
    const badge = (q.dual && quiz.sel.indexOf(L) >= 0)
      ? '<span class="ord">' + (quiz.sel.indexOf(L) + 1) + '</span>' : '';
    return '<button class="' + cls + '" data-pick="' + L + '">' +
      '<span class="key">' + L + '</span><span class="ot">' + fmt(t) + '</span>' + badge + '</button>';
  }).join('');
}

function renderQuiz() {
  const body = $('quizBody');
  const prog = $('quizProg');

  if (quiz.mode === 'overview') {
    prog.innerHTML = '';
    body.innerHTML = overviewHTML();
    return;
  }
  if (!quiz.order.length) {
    prog.innerHTML = '';
    body.innerHTML = '<div class="empty"><span class="big">🎉</span>错题本是空的<br>你还没有答错的题目，先去顺序刷一轮吧' +
      '<div style="margin-top:14px"><button class="btn pri" id="qBackSeq" style="max-width:220px;margin:0 auto">去顺序刷题</button></div></div>';
    return;
  }
  if (quiz.finished) {
    prog.innerHTML = '';
    const rate = quiz.sTotal ? Math.round(quiz.sRight / quiz.sTotal * 100) : 0;
    body.innerHTML = '<div class="qcard done"><div class="done-ico">🎉</div>' +
      '<h3>本组题目已刷完</h3>' +
      '<p>本轮作答 <b>' + quiz.sTotal + '</b> 题 · 首答正确 <b>' + quiz.sRight + '</b> 题 · 正确率 <b>' + rate + '%</b></p>' +
      '<div class="fc-actions2"><button class="btn pri" id="qAgain">再刷一轮</button>' +
      '<button class="btn ghost" id="qToWrong">查看错题本</button></div></div>';
    return;
  }

  const q = QMAP[quiz.order[quiz.i]];
  const total = quiz.order.length;

  prog.innerHTML = '<div class="pg-txt"><span>第 <b>' + (quiz.i + 1) + '</b> / ' + total + ' 题</span>' +
    '<span class="pg-rate">' + (quiz.sTotal ? '首答正确率 ' + Math.round(quiz.sRight / quiz.sTotal * 100) + '%' : '') + '</span></div>' +
    '<div class="pg-track"><div class="pg-fill" style="width:' + Math.round(quiz.i / total * 100) + '%"></div></div>';

  const tagCls = q.kind === 'tf' ? 'q-tag' : (q.dual ? 'q-tag dual' : 'q-tag');
  const tagTxt = q.kind === 'tf' ? '判断题' : (q.dual ? '双空选择题' : '单项选择题');

  let html = '<div class="qcard">' +
    '<div class="q-top"><span class="' + tagCls + '">' + tagTxt + '</span>' +
    '<span class="q-no">No.' + pad2(q.n) + '</span></div>' +
    '<div class="q-stem">' + fmt(q.q).replace(/（\s*①\s*）/g, '（<span class="u">①</span>）').replace(/（\s*②\s*）/g, '（<span class="u">②</span>）') + '</div>';

  if (q.dual) {
    html += '<div class="dual-hint">本题为双空题：请按顺序点选 —— 第 <b>①</b> 空 → 第 <b>②</b> 空（再点一次可取消该选项）</div>';
  }
  html += '<div class="opts">' + optsHTML(q) + '</div>';

  if (quiz.judged) {
    if (quiz.ok) {
      let extra = '';
      if (q.dual) extra += '<span class="my">' + ansText(q) + '</span>';
      if (wrongBook[q.id]) extra += '<span class="my">（本题仍在错题本，可手动移出）</span>';
      html += '<div class="res ok">✅ 回答正确' + extra + '</div>';
    } else {
      html += '<div class="res no">❌ 回答错误 <span class="my">正确答案：' + ansText(q) + ' · 已存入错题本</span></div>';
    }
    html += '<div class="exp"><div class="exp-h">秒杀解析</div><p>' + fmt(q.exp) + '</p></div>';
  }

  html += '<div class="q-nav">' +
    '<button class="btn ghost" id="qPrev"' + (quiz.i === 0 ? ' disabled' : '') + '>◀ 上一题</button>' +
    '<button class="btn pri" id="qNext">' + (quiz.i === total - 1 ? '完成本组 ✓' : '下一题 ▶') + '</button>' +
    '</div>';

  let extra = '';
  if (quiz.judged) extra += '<button class="btn ghost" id="qRedo">↺ 重做本题</button>';
  if (wrongBook[q.id]) extra += '<button class="btn ok" id="qUnmark">✔ 移出错题本</button>';
  if (extra) {
    const two = quiz.judged && wrongBook[q.id];
    html += '<div class="fc-actions2' + (two ? '' : ' one') + '" style="margin-top:8px">' + extra + '</div>';
  }

  html += '<div class="kbd-tip">键盘：A / B / C / D 或 1 / 2 选答案 · Enter 或 → 下一题 · ← 上一题</div></div>';

  body.innerHTML = html;
}

function overviewHTML() {
  let h = '<div class="ov-bar"><div class="ov-info">共 <b>48</b> 题 · 判断 28 + 选择 20</div>' +
    '<button class="ov-toggle" id="ovToggle">' + (quiz.ovHide ? '👁 显示解析' : '🙈 遮挡解析') + '</button></div>';

  h += '<div class="ov-sec">判断题 <span>28 题 · 正确 √ / 错误 ×</span></div>';
  h += STUDY_DATA.tfQuestions.map(q => {
    const flag = wrongBook['tf-' + q.n] ? '<span class="ov-flag">错题</span>' : '';
    return '<div class="ov-item' + (quiz.ovHide ? ' hide-exp' : '') + '">' +
      '<div class="ov-line"><span class="ov-no">' + pad2(q.n) + '</span>' +
      '<div class="ov-q">' + fmt(q.q) + flag + '</div>' +
      '<span class="ans">' + (q.a ? '√' : '×') + '</span></div>' +
      '<div class="ov-exp">' + fmt(q.exp) + '</div></div>';
  }).join('');

  h += '<div class="ov-sec">选择题 <span>20 题 · 含 3 道双空</span></div>';
  h += STUDY_DATA.mcQuestions.map(q => {
    const flag = wrongBook['mc-' + q.n] ? '<span class="ov-flag">错题</span>' : '';
    const dual = q.ans.length > 1;
    const opts = q.opts.map((t, i) => {
      const L = 'ABCD'[i];
      const isAns = q.ans.indexOf(L) >= 0;
      return '<i>' + L + '.</i>' + (isAns ? '<b>' + esc(t) + '</b>' : esc(t));
    }).join('　');
    const ansLabel = dual
      ? q.ans.map((L, i) => '①②'[i] + L).join(' ')
      : q.ans[0];
    return '<div class="ov-item' + (quiz.ovHide ? ' hide-exp' : '') + '">' +
      '<div class="ov-line"><span class="ov-no">' + pad2(q.n) + '</span>' +
      '<div class="ov-q">' + fmt(q.q) + flag + '</div>' +
      '<span class="ans">' + ansLabel + '</span></div>' +
      '<div class="ov-opts">' + opts + '</div>' +
      '<div class="ov-exp">' + fmt(q.exp) + '</div></div>';
  }).join('');

  return h;
}

function handlePick(v) {
  const q = QMAP[quiz.order[quiz.i]];
  if (!q || quiz.judged) return;
  if (q.kind === 'tf') { quiz.sel = [v]; judgeNow(); return; }
  /* 选项越界校验：3 个选项的题按 D / 4 键直接忽略，不计入作答 */
  const oi = 'ABCD'.indexOf(v);
  if (oi < 0 || oi >= q.opts.length) return;
  if (!q.dual) { quiz.sel = [v]; judgeNow(); return; }
  if (quiz.sel.indexOf(v) >= 0) {
    quiz.sel = quiz.sel.filter(x => x !== v);
    renderQuiz(); return;
  }
  if (quiz.sel.length >= 2) quiz.sel = [quiz.sel[1]];
  quiz.sel.push(v);
  if (quiz.sel.length === 2) judgeNow();
  else renderQuiz();
}

function judgeNow() {
  const q = QMAP[quiz.order[quiz.i]];
  const right = q.kind === 'tf'
    ? ((quiz.sel[0] === 'T') === q.a)
    : (q.ans.join('') === quiz.sel.join(''));

  quiz.judged = true;
  quiz.ok = right;
  /* 本轮按「首次作答」计分：重做 / 回退重答不会重复累加 sTotal */
  if (!Object.prototype.hasOwnProperty.call(quiz.marks, q.id)) {
    quiz.marks[q.id] = right;
    quiz.sTotal++;
    if (right) quiz.sRight++;
  }

  progress.answered[q.id] = 1;
  if (right) progress.right[q.id] = 1;
  else delete progress.right[q.id];

  if (!right) {
    const rec = wrongBook[q.id] || { n: 0 };
    rec.n++;
    rec.my = quiz.sel.join('');
    rec.ts = Date.now();
    wrongBook[q.id] = rec;
    saveJSON(KEY.wrong, wrongBook);
  }
  saveJSON(KEY.progress, progress);
  renderStats();
  renderQuiz();
}

function nextQ() {
  if (!quiz.order.length) return;
  if (quiz.i >= quiz.order.length - 1) { quiz.finished = true; renderQuiz(); return; }
  quiz.i++; quiz.sel = []; quiz.judged = false; quiz.ok = false;
  renderQuiz();
  scrollQuizTop();
}
function prevQ() {
  if (quiz.i <= 0) return;
  quiz.i--; quiz.sel = []; quiz.judged = false; quiz.ok = false;
  renderQuiz();
  scrollQuizTop();
}
function scrollQuizTop() {
  const panel = $('panel-quiz');
  const top = panel.getBoundingClientRect().top + window.pageYOffset - 58;
  if (window.pageYOffset > top) window.scrollTo({ top: top, behavior: 'smooth' });
}

   8. Tab 切换 / 分享 / 复制
   ========================================================= */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  progress.tab = tab;
  saveJSON(KEY.progress, progress);
  window.scrollTo(0, 0);
}

function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function copyText(text) {
  return new Promise(resolve => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => resolve(true))
        .catch(() => resolve(fallbackCopy(text)));
    } else {
      resolve(fallbackCopy(text));
    }
  });
}

function openLightbox(src, alt) {
  const lb = $('lightbox'), im = $('lbImg');
  im.src = src;
  im.alt = alt || '';
  lb.classList.add('show');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  const lb = $('lightbox');
  if (!lb || !lb.classList.contains('show')) return;
  lb.classList.remove('show');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  $('lbImg').removeAttribute('src');
}

/* =========================================================
   9. 事件绑定
   ========================================================= */
function bindEvents() {
  /* --- tabs --- */
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  /* --- 分享 --- */
  $('shareBtn').addEventListener('click', async () => {
    const url = window.location.href;
    const ok = await copyText(url);
    if (ok) {
      toast('链接已复制，快发到宿舍群一起背题！');
    } else {
      window.prompt('自动复制失败，请长按选中下方链接手动复制：', url);
    }
  });

  /* --- 章节筛选 --- */
  $('chFilter').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.ch = chip.dataset.ch;
    progress.ch = state.ch;
    saveJSON(KEY.progress, progress);
    renderFilter();
    renderChapters();
    window.scrollTo(0, 0);
  });

  /* --- 挖空遮罩开关 --- */
  $('clozeToggle').addEventListener('change', e => {
    state.cloze = e.target.checked;
    progress.cloze = state.cloze;
    saveJSON(KEY.progress, progress);
    document.body.classList.toggle('cloze', state.cloze);
    updateClozeMeta();
  });

  /* --- 单块翻开 --- */
  $('chapterList').addEventListener('click', e => {
    const el = e.target.closest('.blank');
    if (!el || !state.cloze) return;
    el.classList.toggle('revealed');
    const chId = el.closest('.chapter').dataset.ch;
    const i = parseInt(el.dataset.i, 10);
    const arr = progress.revealed[chId] || (progress.revealed[chId] = []);
    if (el.classList.contains('revealed')) {
      if (arr.indexOf(i) < 0) arr.push(i);
    } else {
      const p = arr.indexOf(i);
      if (p >= 0) arr.splice(p, 1);
    }
    saveJSON(KEY.progress, progress);
    updateClozeMeta();
  });

  /* --- 课件原图：点击放大 / 点击遮罩关闭 --- */
  $('chapterList').addEventListener('click', e => {
    const im = e.target.closest('.shot img');
    if (!im) return;
    openLightbox(im.getAttribute('src'), im.getAttribute('alt'));
  });
  $('lightbox').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  /* --- 翻转卡 --- */
  $('fc').addEventListener('click', () => {
    $('fcInner').classList.toggle('flipped');
  });
  $('fcFlip').addEventListener('click', e => {
    e.stopPropagation();
    $('fcInner').classList.toggle('flipped');
  });
  $('fcPrev').addEventListener('click', () => {
    state.cardIdx = (state.cardIdx - 1 + STUDY_DATA.flashcards.length) % STUDY_DATA.flashcards.length;
    renderCard();
  });
  $('fcNext').addEventListener('click', () => {
    state.cardIdx = (state.cardIdx + 1) % STUDY_DATA.flashcards.length;
    renderCard();
  });
  $('fcRandom').addEventListener('click', () => {
    if (STUDY_DATA.flashcards.length < 2) return;
    let n = state.cardIdx;
    while (n === state.cardIdx) n = Math.floor(Math.random() * STUDY_DATA.flashcards.length);
    state.cardIdx = n;
    renderCard();
    toast('🎲 随机抽到：' + STUDY_DATA.flashcards[n].code);
  });
  $('fcWeakOnly').addEventListener('click', () => {
    const weak = [];
    STUDY_DATA.flashcards.forEach((c, i) => { if (cardState[c.code] === 'weak') weak.push(i); });
    if (!weak.length) { toast('还没有标记「没记住」的牌号'); return; }
    let n = weak[Math.floor(Math.random() * weak.length)];
    state.cardIdx = n;
    renderCard();
    toast('🎯 重点强化：' + STUDY_DATA.flashcards[n].code);
  });
  $('fcKnown').addEventListener('click', () => markCard('known'));
  $('fcWeak').addEventListener('click', () => markCard('weak'));
  $('fcDots').addEventListener('click', e => {
    const d = e.target.closest('.dot');
    if (!d) return;
    state.cardIdx = parseInt(d.dataset.card, 10);
    renderCard();
  });

  /* --- 刷题模式 --- */
  $('modeBar').addEventListener('click', e => {
    const b = e.target.closest('.mode');
    if (!b) return;
    setMode(b.dataset.mode);
  });

  /* --- 答题区事件委托 --- */
  $('quizBody').addEventListener('click', e => {
    const ovExp = e.target.closest('.ov-exp');
    if (ovExp) {
      const item = ovExp.closest('.ov-item');
      if (item && item.classList.contains('hide-exp')) item.classList.add('revealed');
      return;
    }
    const pick = e.target.closest('[data-pick]');
    if (pick) { handlePick(pick.dataset.pick); return; }

    const btn = e.target.closest('button');
    if (!btn) return;
    switch (btn.id) {
      case 'qNext': nextQ(); break;
      case 'qPrev': prevQ(); break;
      case 'qRedo':
        quiz.sel = []; quiz.judged = false; quiz.ok = false; renderQuiz(); break;
      case 'qUnmark': {
        const q = QMAP[quiz.order[quiz.i]];
        if (q && wrongBook[q.id]) {
          delete wrongBook[q.id];
          saveJSON(KEY.wrong, wrongBook);
          renderStats(); renderQuiz();
          toast('已移出错题本');
        }
        break;
      }
      case 'qAgain': setMode(quiz.mode); break;
      case 'qToWrong': setMode('wrong'); break;
      case 'qBackSeq': setMode('seq'); break;
      case 'ovToggle': quiz.ovHide = !quiz.ovHide; renderQuiz(); break;
    }
  });

  /* --- 键盘快捷键（电脑端） --- */
  document.addEventListener('keydown', e => {
    if (state.tab !== 'quiz' || quiz.mode === 'overview' || quiz.finished) return;
    if (!quiz.order.length) return;
    const k = e.key;
    const low = k.toLowerCase();
    const ae = document.activeElement;
    const tag = ae && ae.tagName ? ae.tagName.toUpperCase() : '';
    const onControl = tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!(ae && ae.isContentEditable);
    if (k === 'Enter') {
      /* 焦点在按钮 / 输入框上时交给浏览器默认行为，避免按一次触发两个动作；
         仅在已判分且焦点不在控件上时才进入下一题 */
      if (onControl || !quiz.judged) return;
      e.preventDefault(); nextQ(); return;
    }
    if (k === 'ArrowRight') { e.preventDefault(); nextQ(); return; }
    if (k === 'ArrowLeft') { e.preventDefault(); prevQ(); return; }
    const q = QMAP[quiz.order[quiz.i]];
    if (!q || quiz.judged) return;
    if (q.kind === 'tf') {
      if (k === '1' || low === 'a') { e.preventDefault(); handlePick('T'); }
      else if (k === '2' || low === 'b') { e.preventDefault(); handlePick('F'); }
    } else {
      const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (Object.prototype.hasOwnProperty.call(map, low)) {
        e.preventDefault();
        handlePick('ABCD'[map[low]]);
      }
    }
  });
}

/* =========================================================
   10. 启动
   ========================================================= */
(function init() {
  document.body.classList.toggle('cloze', state.cloze);
  $('clozeToggle').checked = state.cloze;

  renderStats();
  renderFilter();
  renderChapters();
  renderCard();
  setMode('seq');
  switchTab(progress.tab === 'cards' || progress.tab === 'quiz' ? progress.tab : 'read');
  bindEvents();
})();
</script>
</body>
</html>
